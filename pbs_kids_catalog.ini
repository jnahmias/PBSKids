[application]
database = data/pbs-kids-catalog.sqlite3
snapshot_root = data/snapshots
log_level = INFO

[http]
timeout_seconds = 30
user_agent = PBSKidsCatalog/0.3 (+personal catalog synchronization)

[sqlite]
busy_timeout_ms = 5000
journal_mode = WAL
synchronous = NORMAL

[downloads]
media_root = media
temporary_root = data/download-staging
video_types = fullEpisode, movie
preferred_profiles = hls-16x9-1080p, hls-16x9-720p, mp4-16x9-720p, mp4-16x9-baseline
yt_dlp_command = yt-dlp
ffprobe_command = ffprobe
minimum_free_bytes = 1073741824
duration_tolerance_seconds = 5
overwrite = false
